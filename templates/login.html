<!doctype html>
<html lang="{{ current_lang }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ t('pg_login') }} · Linux Manager</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="grid min-h-screen place-items-center bg-slate-950 p-5"><main class="w-full max-w-md rounded-2xl bg-white p-7 shadow-2xl"><div class="mb-7 flex items-center gap-3"><span class="grid size-11 place-items-center rounded-xl bg-blue-600 text-xl font-bold text-white">L</span><div><h1 class="font-bold text-slate-900">Linux Manager</h1><p class="text-sm text-slate-500">{{ t('card_login_sub') }}</p></div><span class="ml-auto flex overflow-hidden rounded-lg border border-slate-200 text-xs font-bold"><a href="{{ url_for('set_language', code='fr') }}?next={{ request.path }}" class="px-2 py-1 {% if current_lang == 'fr' %}bg-blue-600 text-white{% else %}text-slate-500{% endif %}">FR</a><a href="{{ url_for('set_language', code='en') }}?next={{ request.path }}" class="px-2 py-1 {% if current_lang == 'en' %}bg-blue-600 text-white{% else %}text-slate-500{% endif %}">EN</a></span></div>{% if error %}<p class="mb-5 rounded-lg bg-rose-50 p-3 text-sm text-rose-800">{{ error }}</p>{% endif %}<form method="post" class="space-y-5">{{ csrf_token_input() }}<label class="block text-sm font-semibold text-slate-700">{{ t('lbl_username') }}<input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-blue-500" name="username" autocomplete="username" required></label><label class="block text-sm font-semibold text-slate-700">{{ t('lbl_password') }}<input class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-blue-500" type="password" name="password" autocomplete="current-password" required></label><button class="w-full rounded-lg bg-blue-600 px-4 py-2.5 font-semibold text-white hover:bg-blue-700">{{ t('btn_login') }}</button></form></main></body></html>
