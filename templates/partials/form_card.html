<section class="mx-auto max-w-2xl"><div class="mb-6"><a href="{% url 'menu' %}" class="text-sm font-semibold text-brand-600 hover:text-brand-700">{{ t('btn_back') }}</a><h2 class="mt-3 text-2xl font-bold text-slate-900">{{ form_title }}</h2><p class="mt-1 text-slate-500">{{ form_description }}</p></div><div class="panel p-5 sm:p-7">{% if message %}<div class="mb-5 rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800">✓ {{ message }}</div>{% endif %}{% if error %}<div class="mb-5 rounded-lg border border-rose-200 bg-rose-50 p-4 text-sm text-rose-800">{{ error }}</div>{% endif %}<form method="post" class="space-y-5" novalidate>{% csrf_token %}{% for field in form %}<div><label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold text-slate-700">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="mt-1 text-sm text-rose-600">{{ field.errors }}</div>{% endif %}</div>{% endfor %}<div class="flex flex-wrap gap-3 border-t border-slate-100 pt-5"><button type="submit" class="{% if is_danger %}btn-danger{% else %}btn-primary{% endif %}">{{ button_text|default(t('btn_validate')) }}</button><a href="{% url 'menu' %}" class="btn-secondary">{{ t('btn_cancel') }}</a></div></form></div></section>
